# schema: finapp-dynamics/naming-map/v1
# Explicit module -> (api prefix, permission namespace, event family, audit prefix) mapping.
#
# WHY THIS FILE EXISTS
#   The three existing registries name the same domain three different ways, and NO mechanical rule
#   converts between them:
#       m20-glrecon  ->  /api/v1/gl-reconciliation  |  gl_reconciliation.*  |  glrecon.lifecycle
#       m13-case     ->  /api/v1/cases              |  cases.*              |  case.lifecycle
#       m21-journal  ->  /api/v1/journals           |  journals.*           |  journal.lifecycle
#   API paths are kebab-case + plural; permission namespaces are snake_case + plural; event families are
#   singular. A derivation function is impossible; the kernel needs this lookup table instead.
#
# AUTHORITY
#   This file is DERIVED and must not drift. api-registry.yaml, permission-registry.yaml and
#   event-registry.yaml remain authoritative for their own axis; implementation-manifest.yaml is
#   authoritative for event_ownership. `tools/conformance` re-derives this map from those four files and
#   fails CI on any disagreement. Fix the source registry, never this file alone.
#
# KERNEL CONTRACT
#   @Endpoint({ permission, auditCode }) is validated at boot against the owning module's row:
#     - the route's prefix must belong to the declaring module
#     - `permission` must fall under one of that module's permission_namespaces
#     - `auditCode` must start with one of that module's audit_prefixes AND be registered in
#       audit-code-registry.yaml
#     - events published via OUTBOX must belong to that module's event_families
#   A mismatch is a boot-time failure, not a warning (fail-closed, ADR-009).
registry_version: 1
derived_from: [api-registry.yaml, permission-registry.yaml, event-registry.yaml, implementation-manifest.yaml]

conventions:
  api_prefix: kebab-case, plural, under /api/v1
  permission_namespace: snake_case, plural, format <domain>.<entity>.<action>
  event_family: dot-lowercase-snake, singular domain, <domain>.<aggregate>_lifecycle | <domain>.<event>
  audit_prefix: SCREAMING_SNAKE with trailing underscore

# gap: capability is required but the axis has no registered entry — MUST be resolved before that module ships.
# n/a: module legitimately owns nothing on that axis (e.g. m04-admin owns no tables and emits no events).
modules:
  # ---------- Stage 0 — foundation packages (own nothing on any axis, by design) ----------
  - module: kernel
    stage: 0
    mvp: true
    api_prefixes: []
    permission_namespaces: []
    event_families: []
    audit_prefixes: []
    note: >
      Owns the DI tokens (DB, AUDIT, AUTHZ, OUTBOX), RequestContext, ProblemError, @Endpoint and the
      ambient-transaction Db. Enforces this map; never appears in it as a claimant.

  - module: contracts
    stage: 0
    mvp: true
    api_prefixes: []
    permission_namespaces: []
    event_families: []
    audit_prefixes: []
    note: Declares the typed event union. Empty at Stage 0; families append at the tail, never renumbered.

  # ---------- Stage 1 — SaaS foundation (approved_for_build) ----------
  - module: m01-tenant
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/tenants]
    permission_namespaces: ['tenant.*']
    event_families: [tenant.lifecycle]
    event_family_registered: true # GAP-1 closed in Stage 1A: registered in event-registry.yaml
    audit_prefixes: [TENANT_]
    # Concrete names registered in Stage 1A. Both entity segments exist because the two authorities
    # disagree with the obvious name: the kernel requires <domain>.<entity>.<action> (so `tenant.view`
    # is invalid) and the audit registry requires <PREFIX>_<ENTITY>_<ACTION> (so `TENANT_CREATED` is
    # invalid). `registry` / `REGISTRY` is the tenant record itself.
    permission_entities: [registry, environment, entity, department, branch]
    audit_entities: [REGISTRY, ENVIRONMENT, ENTITY, DEPARTMENT, BRANCH, ORG]

  - module: m02-identity
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/identities, /api/v1/accounts, /api/v1/tenant-memberships, /api/v1/auth, /api/v1/users, /api/v1/roles]
    permission_namespaces: ['identity.*'] # rbac.* moved to m02-rbac (Stage 1D, D3)
    event_families: [identity.lifecycle]
    event_family_registered: true # GAP-1 closed in Stage 1B: registered in event-registry.yaml
    audit_prefixes: [IDENTITY_] # RBAC_ moved to m02-rbac (Stage 1D)
    # Stage 1B registered three NEW prefixes. The original set had only /api/v1/users for all of identity,
    # and collapsing identities + accounts + memberships behind it would be exactly the "one generic user
    # service" the architecture forbids — identity, account and membership are distinct resources with
    # distinct lifecycles and permissions. /api/v1/users and /api/v1/roles remain reserved for 1C/1D.
    permission_entities: [registry, account, membership] # rbac.* entities land in Stage 1D
    audit_entities: [REGISTRY, ACCOUNT, MEMBERSHIP, SUBJECT]
    substage_owners:
      1B: [/api/v1/identities, /api/v1/accounts, /api/v1/tenant-memberships]
      1C: [/api/v1/auth, /api/v1/users]
      1D: [/api/v1/roles]
    note: /api/v1/auth is auth:mixed — pre-auth routes are the documented exception to tenant resolution.

  - module: m02-auth
    stage: 1
    mvp: true
    # /api/v1/auth is also listed under m02-identity's reserved 1C set above; the route check pools all
    # modules' prefixes, so mounting @Controller('auth') is registered either way. This row is where the
    # auth AUDIT prefix, permission namespace and event family are owned.
    api_prefixes: [/api/v1/auth]
    permission_namespaces: ['auth.*']
    event_families: [identity.authentication]
    event_family_registered: true # GAP-1 closed in Stage 1C: registered in event-registry.yaml
    audit_prefixes: [AUTH_]
    permission_entities: [session]
    audit_entities: [LOGIN, SESSION, CREDENTIAL, LOCKOUT]
    note: >
      Stage 1C. Opaque, revocable server-side sessions (ADR-015) + Argon2id credentials (ADR-016).
      Secure HttpOnly SameSite cookies with CSRF. Retires the Stage 1B dev actor assertion (x-dev-actor).

  - module: m02-rbac
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/rbac]
    permission_namespaces: ['rbac.*']
    event_families: [identity.authorization]
    event_family_registered: true # GAP-1 closed in Stage 1D: registered in event-registry.yaml
    audit_prefixes: [RBAC_]
    permission_entities: [permission, role, assignment, sod, bootstrap]
    audit_entities: [ROLE, ASSIGNMENT, SOD, BOOTSTRAP]
    note: >
      Stage 1D. Persistent RBAC (ADR-017..020). Replaces x-permissions + ContextAuthz. /api/v1/roles stays
      reserved to m02 (naming) but the canonical prefix is /api/v1/rbac (D2).

  - module: m03-audit
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/audit]
    permission_namespaces: ['audit.*']
    event_families: [] # n/a — manifest:68 declares event_ownership: []
    audit_prefixes: [AUDIT_]

  - module: m06-workflow
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/workflow]
    permission_namespaces: ['workflow.*']
    event_families: [workflow.lifecycle]
    event_family_registered: true # GAP-1 closed in Stage 2.2: registered in event-registry.yaml + contracts union
    audit_prefixes: [WORKFLOW_]
    note: Owns OUTBOX — the only event-delivery path (ADR-004). All other modules publish through it.

  - module: m07-rules
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/rules] # GAP-2 resolved in Stage 2.3: m07 exposes its own authoring/evaluation API
    permission_namespaces: ['rules.*']
    event_families: [rules.lifecycle]
    event_family_registered: true # Stage 2.3: registered in event-registry.yaml + contracts union
    audit_prefixes: [RULES_]

  - module: m08-notify
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/notifications]
    permission_namespaces: ['notifications.*']
    event_families: [notification.lifecycle]
    event_family_registered: true # Stage 2.4 — registered in event-registry.yaml alongside m08-notify
    audit_prefixes: [NOTIFY_]

  - module: m09-docs
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/documents]
    permission_namespaces: ['documents.*']
    event_families: [document.lifecycle]
    event_family_registered: true # Stage 2.5 — registered in event-registry.yaml alongside m09-docs
    audit_prefixes: [DOC_]

  - module: m04-admin
    stage: 1
    mvp: true
    api_prefixes: [/api/v1/admin]
    permission_namespaces: ['admin.*']
    event_families: [] # n/a — console over m01/m02/m03/m06/m07/m08
    audit_prefixes: [ADMIN_]

  - module: m10-report
    stage: null # GAP-3: mvp:true but in NO manifest stage
    mvp: true
    api_prefixes: [/api/v1/reports]
    permission_namespaces: ['reports.*']
    event_families: []
    audit_prefixes: [REPORT_]

  - module: m05-hub
    stage: null # GAP-3: mvp:true, phase 1, in NO manifest stage
    mvp: true
    api_prefixes: []
    permission_namespaces: []
    event_families: []
    audit_prefixes: []
    note: >
      Registry defines m05-hub as "Entity registry / adapter seam" with reference_tables:0, but
      DATABASE_SCHEMA_CATALOGUE.md:17 attributes entity_type_registry to m06. Ownership unresolved.

  # ---------- Stage 2 — Operational ----------
  - module: m12-feedback
    stage: 2
    mvp: true
    api_prefixes: [/api/v1/feedback]
    permission_namespaces: ['feedback.*']
    event_families: [feedback.lifecycle]
    event_family_registered: true
    audit_prefixes: [FEEDBACK_]

  - module: m13-case
    stage: 2
    mvp: true
    api_prefixes: [/api/v1/cases]
    permission_namespaces: ['cases.*']
    event_families: [case.lifecycle, case.converted_to_matter]
    event_family_registered: true
    audit_prefixes: [CASE_]
    note: Consumes feedback.escalated. Emits case.converted_to_matter for m14.

  # ---------- Stage 3 — Finance ----------
  - module: m19-finance
    stage: 3
    mvp: true
    api_prefixes: [/api/v1/finance] # GAP-2 resolved in Stage 3.1: m19 exposes its finance-foundation API
    permission_namespaces: ['finance.*']
    permission_namespace_registered: true # GAP-4 resolved in Stage 3.1: finance.* seeded + registered
    event_families: [finance.lifecycle]
    event_family_registered: true
    audit_prefixes: [FIN_]
    note: No module spec exists in docs/04-modules/ — first module of Stage 3 is unspecified.

  - module: m15-recon
    stage: 3
    mvp: true
    api_prefixes: [/api/v1/reconciliation]
    permission_namespaces: ['reconciliation.*']
    permission_namespace_registered: true # Stage 3: reconciliation.* seeded + registered
    event_families: [reconciliation.lifecycle]
    event_family_registered: true
    audit_prefixes: [RECON_]

  - module: m15a-matching
    stage: 3
    mvp: true
    api_prefixes: [] # n/a — engine behind m15-recon
    permission_namespaces: []
    event_families: []
    audit_prefixes: [RECON_] # shares m15's prefix

  - module: m20-glrecon
    stage: 3
    mvp: true
    api_prefixes: [/api/v1/gl-reconciliation]
    permission_namespaces: ['gl_reconciliation.*']
    permission_namespace_registered: true # Stage 3: gl_reconciliation.* seeded + registered
    event_families: [glrecon.lifecycle]
    event_family_registered: true
    audit_prefixes: [GLRECON_]
    note: The canonical three-way divergence — gl-reconciliation / gl_reconciliation / glrecon.

  - module: m21-journal
    stage: 3
    mvp: true
    api_prefixes: [/api/v1/journals]
    permission_namespaces: ['journals.*']
    permission_namespace_registered: true # Stage 3: journals.* seeded (migration 0001) + registered
    event_families: [journal.lifecycle, posting_request.lifecycle]
    event_family_registered: true
    audit_prefixes: [JOURNAL_]
    note: DRAFT-ONLY in MVP. posting_request.lifecycle is registered but posting is deferred.

  - module: m22-approval
    stage: 3
    mvp: true
    api_prefixes: [/api/v1/approvals]
    permission_namespaces: ['approvals.*']
    event_families: [approval.lifecycle]
    event_family_registered: true
    audit_prefixes: [APPROVAL_]

  - module: m23-finance-integration
    stage: 3
    mvp: false
    api_prefixes: []
    permission_namespaces: []
    event_families: []
    audit_prefixes: [FIN_]

  # ---------- Stage 4 — Legal ----------
  - module: m14-legal
    stage: 4
    mvp: partial
    api_prefixes: [/api/v1/legal]
    permission_namespaces: ['legal.*']
    event_families: [legal.lifecycle]
    event_family_registered: true
    audit_prefixes: [LEGAL_]
    note: >
      API_CATALOGUE.md:13 also documents /matters, which is absent from api-registry.yaml.
      Read-only in MVP. Enforces privilege + ethical walls.

  - module: m16-litigation
    stage: 4
    mvp: false
    api_prefixes: [/api/v1/litigation]
    permission_namespaces: [litigation]
    event_families: [litigation.lifecycle]
    event_family_registered: true
    audit_prefixes: [LITIGATION_]

  - module: m17-recovery
    stage: 4
    mvp: false
    api_prefixes: [/api/v1/recovery]
    permission_namespaces: ['recovery.*']
    event_families: [recovery.lifecycle]
    event_family_registered: true
    audit_prefixes: [RECOVERY_]

  - module: m18-legaldocs
    stage: 4
    mvp: false
    api_prefixes: [/api/v1/legaldocs] # GAP-2 resolved in Stage 4.4: m18 exposes its knowledge/library/catalog API
    permission_namespaces: ['legaldocs.*']
    event_families: [legaldocs.lifecycle]
    event_family_registered: true
    audit_prefixes: [LEGALDOC_]

  # ---------- Stage 5 — AI ----------
  - module: m24-ai-foundation
    stage: 5
    mvp: partial
    api_prefixes: [/api/v1/ai]
    permission_namespaces: ['ai.*']
    event_families: [ai.request_lifecycle, ai.output_lifecycle, ai.governance_lifecycle]
    event_family_registered: true
    audit_prefixes: [AI_]

  - module: m25-operational-ai
    stage: 5
    mvp: partial
    api_prefixes: []
    permission_namespaces: ['ai.*'] # shares m24's namespace
    event_families: []
    audit_prefixes: [AI_]

  - module: m26-legal-ai
    stage: 5
    mvp: false
    api_prefixes: []
    permission_namespaces: ['ai.*']
    event_families: []
    audit_prefixes: [AI_]

  - module: m27-finance-ai
    stage: 5
    mvp: partial
    api_prefixes: []
    permission_namespaces: ['ai.*']
    event_families: []
    audit_prefixes: [AI_]
    note: Recon suggestions only. NEVER auto-posts (ADR-006, ADR-007).

  - module: m28-executive-ai
    stage: 5
    mvp: partial
    api_prefixes: [/api/v1/copilot]
    permission_namespaces: ['ai.*'] # GAP-4 resolved (Stage 5 M28): reuses m24's shared ai.* namespace with ai.copilot.* codes (ADR-111)
    permission_namespace_shared: true # shares m24's ai.* (like m25/m26/m27); adds no new namespace
    event_families: [] # reuses m24 ai.*_lifecycle; no new event family, no second outbox
    audit_prefixes: [AI_]
    note: Read-only, cited, RLS-masked. GAP-4 closed by reusing ai.* (ai.copilot.read/query/feedback/export/sensitive/configure/platform).

  - module: m29-ai-governance
    stage: 5
    mvp: false
    api_prefixes: []
    permission_namespaces: ['ai.*']
    event_families: [ai.governance_lifecycle]
    event_family_registered: true
    audit_prefixes: [AI_]

  # ---------- Stage 6 — Enterprise platform ----------
  - module: m30-platform
    stage: 6
    mvp: false
    api_prefixes: [] # internal governed library — no REST surface (ADR-116); m04-admin orchestrates over m30's contracts
    permission_namespaces: ['platform.*'] # GAP-2 resolved (Stage 6A M30): platform.* namespace registered (ADR-115)
    permission_namespace_registered: true
    event_families: [platform.lifecycle]
    event_family_registered: true
    audit_prefixes: [PLATFORM_]
    note: >
      GAP-2 closed (ADR-115): platform.* namespace (platform.metadata/config/feature/secret.* + platform.administer).
      GAP-5 resolved (ADR-115): feature flags were never implemented — m04-admin is an ORCHESTRATION-ONLY console with
      no flag engine; M30 is the CANONICAL owner of the feature-flag engine (+ platform metadata/config/secret-reference
      seam) and m04-admin CONSUMES it by contract. No duplicate engine. M30 owns the secret-reference SEAM only (opaque
      secretref:, zero secret values); real secret/key management = m41-security (ADR-116).

  - module: m31-studio
    stage: 6
    mvp: false
    api_prefixes: [] # internal governed library — no REST surface (ADR-118)
    permission_namespaces: ['studio.*'] # GAP M31-3 resolved (Stage 6B, ADR-118): studio.* namespace registered + seeded
    permission_namespace_registered: true
    event_families: [studio.lifecycle]
    event_family_registered: true
    audit_prefixes: [STUDIO_]
    note: >
      Stage 6B design-time authoring Studio (workflow/rule/form). NOT a second runtime engine — a validated+approved
      design compiles/binds to the canonical m06 workflow + m07 rules contracts (opaque binding only, no duplicate
      table/engine/outbox); studio.lifecycle carries design-time events through the ONE m06 outbox. Canonical owner of
      reusable DECLARATIVE form definitions (FORM DEFINITION != BUSINESS RECORD). No arbitrary code (reuses m06 sandbox +
      m07 conditions, fail closed); publish is a controlled action (maker-checker/SoD, human approver); published version
      immutable; m33 integration deferred behind a fail-closed port; secret-bearing values are opaque secretref: only.

  - module: m32-analytics
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/analytics]
    permission_namespaces: ['analytics.*']
    permission_namespace_registered: true # Stage 6C: analytics.* (12 codes) registered + seeded
    event_families: [analytics.lifecycle]
    event_family_registered: true
    audit_prefixes: [ANALYTICS_]
    note: >
      Stage 6C governed DERIVED/READ analytics builder. NOT a source of truth — source modules stay authoritative; m32
      stores derived, read-only, rebuildable projections with mandatory lineage; no business mutation. NO arbitrary SQL
      (governed semantic query layer: whitelisted dims/measures/operators, parameterized, fail closed). Entitlement
      intersection means aggregation grants no access. Implements the M28 ExecutiveAnalyticsPort (ADR-112). Money is bigint
      minor / exact decimal / integer bps (no float). Metric/report publication is a controlled action (maker-checker;
      published-immutable). Reuses m02/m03/m06/m08/m09/m24/m28/m30 by contract; one m06 outbox; m33/m41 deferred behind
      fail-closed ports. reference_tables 42 reconciled to a governed core of 11.

  - module: m33-integration
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/integration]
    permission_namespaces: ['integration.*']
    permission_namespace_registered: true # Stage 6D-1: integration.* (9 codes) registered + seeded
    event_families: [connector.lifecycle]
    event_family_registered: true
    audit_prefixes: [INTEGRATION_]
    note: >
      Stage 6D-1 governed Integration Foundation: connector SDK/registry, connection management, FRAMEWORK-ONLY connector
      runtime. NOT a production runtime (fail-closed, deterministic doubles, no network egress) and NOT a secrets manager
      (connections store opaque secretref: pointers via the m30 seam; zero secret value columns; real key mgmt = m41 behind
      a fail-closed port). NO arbitrary code (registered capabilities only). Implements m31 IntegrationCapabilityCatalogPort.
      Connector publication is a controlled action (maker-checker; published-immutable). Uses the connector_* table prefix
      (integration_* is owned by m23-finance-integration). Owns connector.lifecycle only; reuses m02/m03/m06/m30 by contract;
      one m06 outbox. reference_tables 38 reconciled to a governed core of 9.

  - module: m34-marketplace
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/connectors]
    permission_namespaces: ['marketplace.*'] # GAP-4 RESOLVED (Stage 6D-2, ADR-121): marketplace.* (8 codes) registered + seeded
    permission_namespace_registered: true
    event_families: [marketplace.lifecycle]
    event_family_registered: true
    audit_prefixes: [MARKETPLACE_]
    note: >
      Stage 6D-2 governed connector marketplace over m33's connectors — catalog listings, tenant installations, consent and
      upgrades. CONSUMES m33 by contract (opaque connector references validated via a fail-closed ConnectorRegistryPort; m34
      never reads m33 tables and never executes a connector). NOT a secrets manager (install secrets are opaque secretref:
      pointers via the m30 seam; zero secret value columns; m41 deferred). Consent + listing publication + upgrade are
      human-governed controlled actions (maker-checker/SoD; AI never consents/approves; consent revocable; published-immutable).
      Uses the marketplace_* prefix (integration_* is m23's, connector_* is m33's). Owns marketplace.lifecycle only; one m06
      outbox. GAP-4 resolved (marketplace.* namespace). reference_tables 25 reconciled to a governed core of 9.

  - module: m35-devportal
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/developer]
    permission_namespaces: ['devportal.*'] # GAP-4 RESOLVED (Stage 6D-3, ADR-122): devportal.* (8 codes) registered + seeded
    permission_namespace_registered: true
    event_families: [devportal.lifecycle]
    event_family_registered: true
    audit_prefixes: [DEVPORTAL_]
    note: >
      Stage 6D-3 governed developer portal + API-gateway FACADE over the platform — developer applications, API credentials,
      published API products and app subscriptions (public exposure). It is a GOVERNED FACADE: a product exposes only
      ALLOW-LISTED operations, each carrying the m02 permission it requires — public exposure never bypasses m02 RBAC or m01
      tenancy. NOT a secrets manager: an API credential persists a one-way sha256: hash XOR an opaque secretref: pointer (the
      m30 seam); zero plaintext credential columns; m41 deferred. Credential issuance/rotation/revocation are human-governed
      (AI never issues); product publication + subscription approval are maker-checker/SoD controlled actions (AI never
      approves; published-immutable). CONSUMES m34/m33 by contract (opaque source references validated via a fail-closed
      CatalogSourcePort; m35 reads no m33/m34 table) and m39-saas by contract for public quotas (fail-closed UsageQuotaPort;
      m39 unbuilt -> deny). Uses the devportal_* prefix (integration_* is m23's, connector_* is m33's, marketplace_* is
      m34's). Owns devportal.lifecycle only; one m06 outbox. GAP-4 resolved (devportal.* namespace). reference_tables 18
      reconciled to a governed core of 9.

  - module: m36-events
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/webhooks, /api/v1/events]
    permission_namespaces: [] # GAP-4: /webhooks + /events have no permission namespace
    event_families: [webhook.lifecycle, eventstream.lifecycle]
    event_family_registered: true
    audit_prefixes: [WEBHOOK_, EVENTSTREAM_]

  - module: m37-govrelease
    stage: 6
    mvp: false
    api_prefixes: []
    permission_namespaces: []
    event_families: [govrelease.lifecycle]
    event_family_registered: true
    audit_prefixes: [INTEGRATION_]

  - module: m38-automation
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/automation, /api/v1/extensions]
    permission_namespaces: ['automation.*', 'extensions.*']
    event_families: [automation.lifecycle, extension.lifecycle]
    event_family_registered: true
    audit_prefixes: [AUTOMATION_, EXTENSION_]

  - module: m39-saas
    stage: 6
    mvp: false
    api_prefixes: [] # GAP-2
    permission_namespaces: ['saas.*']
    event_families: [subscription.lifecycle, usage.lifecycle, billing.lifecycle]
    event_family_registered: true
    audit_prefixes: [SAAS_]
    note: >
      Owns entitlements/quotas + usage metering per SHARED_SERVICE_OWNERSHIP.md:22-23, but manifest:46
      gives subscription_plans/tenant_subscriptions/usage_meters to m01-tenant in Stage 1. See GAP-6.

  - module: m40-resilience
    stage: 6
    mvp: false
    api_prefixes: []
    permission_namespaces: []
    event_families: [mobile.lifecycle, backup.lifecycle, dr.lifecycle]
    event_family_registered: true
    audit_prefixes: [RESILIENCE_]

  - module: m41-security
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/security, /api/v1/grc, /api/v1/privacy]
    permission_namespaces: ['security.*', 'grc.*', 'privacy.*']
    event_families:
      [
        security.identity_lifecycle,
        security.privileged_lifecycle,
        security.dlp_lifecycle,
        security.crypto_lifecycle,
        security.grc_lifecycle,
        security.privacy_lifecycle,
        security.soc_lifecycle,
      ]
    event_family_registered: true
    audit_prefixes: [SEC_, GRC_, PRIV_]
    note: Posture over RBAC — never replaces the authoritative control (ADR-009).

  - module: m42-certification
    stage: 6
    mvp: false
    api_prefixes: [/api/v1/platform-certification]
    permission_namespaces: ['platform_certification.*']
    event_families:
      [
        certification.programme_lifecycle,
        certification.migration_lifecycle,
        certification.uat_lifecycle,
        certification.pilot_lifecycle,
        certification.release_lifecycle,
      ]
    event_family_registered: true
    audit_prefixes: [CERT_]

  - module: m11-ai
    stage: null # GAP-3: in registry (phase 2), in NO manifest stage
    mvp: false
    api_prefixes: []
    permission_namespaces: []
    event_families: []
    audit_prefixes: []
    note: Early AI seam, 14 reference tables. Superseded by m24? Unresolved.

conformance_checks:
  - every api_prefix here exists in api-registry.yaml, and vice versa
  - every permission_namespace here exists in permission-registry.yaml, and vice versa
  - every event_family here appears in implementation-manifest.yaml event_ownership
  - every audit_prefix here exists in audit-code-registry.yaml prefixes
  - no api_prefix, permission_namespace or audit_prefix is claimed by two modules
  - every module with api_prefixes has at least one permission_namespace # currently FAILS — see GAP-4

# Gaps blocking a clean derivation. Each needs an owner decision; none blocks Stage 0 itself.
gaps:
  - id: GAP-1
    severity: blocks_stage_1
    issue: >
      event-registry.yaml enumerates 44 of its declared 81 families and omits the ENTIRE foundation group.
      tenant.lifecycle, identity.lifecycle, workflow.lifecycle, notification.lifecycle and
      document.lifecycle are all declared in implementation-manifest.yaml event_ownership but appear in
      no family_group. Every Stage 1 module that emits events emits an unregistered family.
    affects: [m01-tenant, m02-identity, m06-workflow, m08-notify, m09-docs]
  - id: GAP-2
    severity: blocks_owning_stage
    issue: Modules with no registered API prefix and/or no permission namespace.
    affects: [m07-rules, m16-litigation, m19-finance, m39-saas] # m18-legaldocs (Stage 4.4) + m30-platform (Stage 6A, ADR-115) resolved
  - id: GAP-3
    severity: blocks_stage_1
    issue: m05-hub and m10-report are mvp:true but appear in no manifest stage; m11-ai likewise absent.
    affects: [m05-hub, m10-report, m11-ai]
  - id: GAP-4
    severity: blocks_owning_stage
    issue: >
      Route families with no permission namespace (/connectors, /webhooks, /events). Every controlled
      route needs a permission, so these are un-shippable as specified. RESOLVED for /copilot (Stage 5
      M28: reuses the shared ai.* namespace with ai.copilot.* codes, ADR-111) and earlier for finance.*
      (Stage 3.1: finance.* seeded + registered).
    affects: [m34-marketplace, m36-events]
  - id: GAP-5
    severity: blocks_stage_1
    issue: >
      RESOLVED (Stage 6A M30, ADR-115): the "conflict" was documentation-only — feature flags were never implemented,
      and m04-admin is an ORCHESTRATION-ONLY console with no flag engine. M30 is the CANONICAL owner of the one
      feature-flag engine (+ platform metadata/config/secret-reference seam); m04-admin CONSUMES it by contract. Recorded
      in SHARED_SERVICE_OWNERSHIP.md. No duplicate engine.
    affects: []
  - id: GAP-6
    severity: blocks_stage_1
    issue: Subscription/entitlement tables owned by m01 (Stage 1) but the service is owned by m39-saas (Stage 6, deferred).
    affects: [m01-tenant, m39-saas]
