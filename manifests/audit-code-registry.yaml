  - { code: AUTH_CREDENTIAL_CREATED, module: m02-auth, severity: normal, reason_required: false }
  - { code: AUTH_CREDENTIAL_CHANGED, module: m02-auth, severity: normal, reason_required: false }
  - { code: AUTH_CREDENTIAL_DISABLED, module: m02-auth, severity: normal, reason_required: true }
  - { code: AUTH_LOCKOUT_INITIATED, module: m02-auth, severity: elevated, reason_required: true }
  - { code: AUTH_LOCKOUT_CLEARED, module: m02-auth, severity: normal, reason_required: false }
