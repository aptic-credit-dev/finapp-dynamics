  - { code: RBAC_ASSIGNMENT_REVOKED, module: m02-rbac, severity: elevated, reason_required: true }
  - { code: RBAC_ASSIGNMENT_EXPIRED, module: m02-rbac, severity: normal, reason_required: false }
