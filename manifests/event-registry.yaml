# schema: finapp-dynamics/event-registry/v1
# Domain-event family registry. One typed envelope per family, declared in the contracts event union, published
# through the single m06 transactional outbox, versioned payloads (v:1), idempotent consumers, tenant +
# correlation context. Reference baseline: 81 families. status is for the target repo.
registry_version: 1
delivery: transactional_outbox (m06)
reference_family_count: 81
rules:
  - Append new families to the union tail; never reuse or renumber.
  - Publish in-transaction with the state change (exactly-once intent).
  - No cross-tenant subscription; dead-letter + replay supported.
family_groups:
  # GAP-1 CLOSED (Stage 1A). implementation-manifest.yaml declared tenant.lifecycle as m01's family, but
  # it was absent from this registry — naming-map.yaml flagged the disagreement as
  # `event_family_registered: false`. Registered here alongside the module that owns and emits it.
  - {group: tenancy, families: [tenant.lifecycle], mvp: true, status: implemented, owner: m01-tenant,
     note: "17 event types in one family; payload v1. Types discriminate within the family — a new
            lifecycle event is a new type, never a new family, so consumer subscriptions stay stable."}
  # GAP-1 CLOSED for m02 (Stage 1B) — identity.lifecycle was declared in implementation-manifest but was
  # absent here; naming-map flagged it as event_family_registered: false. Registered alongside the module
  # that owns and emits it, per CLAUDE.md (events ship with their module).
  # GAP-1 CLOSED for m02-auth (Stage 1C) — identity.authentication registered alongside the module that
  # owns and emits it, in the same commit. 11 event types, payload v1; identifiers/transitions ONLY (never
  # a password, hash, token, raw identifier, email or name). Classification confidential.
  # GAP-1 CLOSED for m02-rbac (Stage 1D) — identity.authorization registered with the module that emits it.
  # 12 event types, payload v1; identifiers/transitions only (never a permission set dump or secret).
  - {group: authorization, families: [identity.authorization], mvp: true, status: implemented, owner: m02-rbac,
     note: "Stage 1D. Role/assignment/SoD lifecycle + bootstrap. Account-plane: tenantId is the real tenant
            for tenant roles, PLATFORM_TENANT for platform roles."}
  - {group: authentication, families: [identity.authentication], mvp: true, status: implemented, owner: m02-auth,
     note: "Stage 1C. Opaque-session + credential lifecycle. Account-plane: tenantId is PLATFORM_TENANT."}
  - {group: identity, families: [identity.lifecycle], mvp: true, status: implemented, owner: m02-identity,
     classification: confidential,
     note: "18 event types in one family; payload v1. Payloads carry identifiers and transitions ONLY —
            never email, phone or names: these events concern natural persons (Kenya DPA) and must not
            reach an unapproved AI provider (ADR-006). Identity/account events are platform-scoped and
            carry the all-zero PLATFORM_TENANT sentinel; membership events carry the real tenant."}
  # GAP-1 CLOSED for m06-workflow (Stage 2.2) — workflow.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/workflow-events.ts. 14 event types, payload v1; identifiers/transitions
  # ONLY (never workflow variable values or task payloads). Delivered through the single transactional outbox.
  - {group: workflow, families: [workflow.lifecycle], mvp: true, status: implemented, owner: m06-workflow,
     classification: confidential,
     note: "Stage 2.2. Definition/instance/task/SLA/incident lifecycle. Ordering key = aggregate id;
            consumers dedupe on (type, aggregateId, version). m06 owns the outbox (ADR-004/023)."}
  # GAP-2 addressed for m07-rules (Stage 2.3) — rules.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/rules-events.ts. Delivered through the single transactional outbox
  # (m06). 9 event types, payload v1; identifiers/reason-codes/hashes ONLY (never raw rule inputs/outputs).
  - {group: rules, families: [rules.lifecycle], mvp: true, status: implemented, owner: m07-rules,
     classification: confidential,
     note: "Stage 2.3. Rule-set lifecycle + evaluation outcomes. Ordering key = aggregate id; consumers
            dedupe on (type, aggregateId, version). Payloads carry input/context HASHES, never raw values."}
  # GAP-1 CLOSED for m08-notify (Stage 2.4) — notification.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/notification-events.ts. Delivered through the single transactional outbox
  # (m06). 21 event types, payload v1; identifiers/channel/status/reason-codes ONLY (never destinations, rendered
  # bodies, provider secrets, or variable values).
  - {group: notifications, families: [notification.lifecycle], mvp: true, status: implemented, owner: m08-notify,
     classification: confidential,
     note: "Stage 2.4. Template + request + escalation + inbox lifecycle. Ordering key = aggregate id (payload
            id); consumers dedupe on eventId. Payloads carry ids/channel/status/reason-codes, never raw values."}
  # GAP-1 CLOSED for m09-docs (Stage 2.5) — document.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/document-events.ts. Delivered through the single transactional outbox
  # (m06). 22 event types, payload v1; identifiers/states/content-hashes/storage-refs ONLY (never raw content,
  # extracted text, signed URLs, storage credentials, or encryption keys).
  - {group: documents, families: [document.lifecycle], mvp: true, status: implemented, owner: m09-docs,
     classification: confidential,
     note: "Stage 2.5. Document + version + access + disposition lifecycle. Ordering key = aggregate id
            (payload documentId); consumers dedupe on eventId. Payloads carry ids/states/hashes, never content."}
  # GAP-1 CLOSED for m12-feedback (Stage 3.1) — feedback.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/feedback-events.ts. Delivered through the single transactional outbox
  # (m06). 24 event types, payload v1; identifiers/statuses/reason-codes/safe-dimensions ONLY (never customer
  # contacts, narratives, confidential internal responses, document contents, or notification destinations).
  - {group: feedback, families: [feedback.lifecycle], mvp: true, status: implemented, owner: m12-feedback,
     classification: confidential,
     note: "Stage 3.1. Feedback capture -> classification -> resolution -> closure + case handoff. Ordering key
            = aggregate id (payload feedbackId); consumers dedupe on eventId. Payloads carry ids/statuses only."}
  # GAP-1 CLOSED for m13-case (Stage 3.2) — case.lifecycle + case.converted_to_matter registered with the engine
  # that emits them, declared in packages/contracts/src/case-events.ts. Delivered through the single transactional
  # outbox (m06). case.lifecycle: 32 event types; case.converted_to_matter: 1 event type; payloads v1; carry
  # identifiers/states/dates/safe-reason-codes/safe-dimensions ONLY (never privileged notes, private party
  # contacts, correspondence bodies, full allegations, legal advice, document contents, confidential settlement
  # terms, storage references, or notification destinations).
  - {group: case, families: [case.lifecycle, case.converted_to_matter], mvp: true, status: implemented, owner: m13-case,
     classification: confidential,
     note: "Stage 3.2. Case intake (incl. M12 handoff) -> triage -> assignment -> investigation/legal/recovery ->
            decision -> resolution -> closure, + the controlled m14 legal-matter boundary (case.converted_to_matter).
            Ordering key = aggregate id (payload caseId); consumers dedupe on eventId. Payloads carry ids/states only."}
  # GAP-1 CLOSED for m14-legal (Stage 4.1) — legal.lifecycle registered with the engine that emits it, declared in
  # packages/contracts/src/legal-events.ts. Delivered through the single transactional outbox (m06). 36 event types,
  # payload v1; carry ids/states/dates/safe-amounts/reason-codes/dimensions ONLY (never legal advice, strategy,
  # full opinions, privileged notes, private party contacts, full pleadings, document contents, confidential
  # settlement terms, counsel bank/payment details, or raw correspondence). m14 consumes m13's case.converted_to_matter.
  - {group: legal_matter, families: [legal.lifecycle], mvp: true, status: implemented, owner: m14-legal,
     classification: confidential,
     note: "Stage 4.1. Legal matter intake (incl. M13 case conversion) -> instruction -> assignment -> analysis/
            litigation/court diary -> settlement/judgment/appeal/enforcement -> closure. Ordering key = aggregate id
            (payload matterId); consumers dedupe on eventId. Payloads carry ids/states only."}
  # GAP CLOSED for m16-litigation (Stage 4.2) — litigation.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/litigation-events.ts. Delivered through the single transactional outbox (m06).
  # 36 event types, payload v1; carry ids/states/dates/safe-amounts/reason-codes/dimensions ONLY (never legal
  # strategy, full pleadings, witness statements, full submissions, private witness/party contacts, full orders,
  # document contents, or confidential outcome terms). m16 consumes an M14 matter referral (governed inbound
  # contract) and emits safe enforcement (m17) / knowledge (m18) boundary signals.
  - {group: litigation, families: [litigation.lifecycle], mvp: false, status: implemented, owner: m16-litigation,
     classification: confidential,
     note: "Stage 4.2. Proceeding referral/creation -> assignment -> filings/service -> appearances/hearings ->
            orders/compliance -> ruling/judgment -> appeal -> conclusion/closure. Ordering key = aggregate id
            (payload proceedingId); consumers dedupe on eventId. Payloads carry ids/states only."}
  # GAP CLOSED for m17-recovery (Stage 4.3) — recovery.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/recovery-events.ts. Delivered through the single transactional outbox (m06).
  # 36 event types, payload v1; carry ids/states/dates/safe-amounts/reason-codes/dimensions ONLY (never debtor
  # contacts, negotiation strategy, settlement terms, bank/payment details, security valuations, or document
  # contents). m17 consumes an M16 enforcement referral (governed inbound contract). ALL amounts are REFERENCES
  # only — m17 performs no cash application, no ledger posting, no accounting write-off.
  - {group: recovery, families: [recovery.lifecycle], mvp: false, status: implemented, owner: m17-recovery,
     classification: confidential,
     note: "Stage 4.3. Recovery referral/creation -> strategy -> demand/negotiation -> arrangement/enforcement ->
            security/agent -> receipt/waiver/write-off -> outcome -> resolution/closure. Ordering key = aggregate
            id (payload recoveryId); consumers dedupe on eventId. Payloads carry ids/states only."}
  # GAP CLOSED for m18-legaldocs (Stage 4.4) — legaldocs.lifecycle registered with the engine that emits it,
  # declared in packages/contracts/src/legaldocs-events.ts. Delivered through the single transactional outbox (m06).
  # 36 event types, payload v1; carry ids/record-types/states/dates/reason-codes/safe-dimensions ONLY (never
  # privileged legal advice, confidential clause/opinion/analysis text, drafting strategy, or document contents).
  # m18 references m09 documents / m14 matters / m16 litigation / m17 recoveries by OPAQUE id — it reads no other
  # module's tables. No finance, no AI, no vector/semantic search.
  - {group: legal, families: [legaldocs.lifecycle], mvp: partial, status: implemented, owner: m18-legaldocs,
     classification: confidential,
     note: "Stage 4.4. Knowledge create -> assign -> submit -> review -> approve -> publish -> supersede/withdraw/
            archive/reopen; authorities/treatments, precedents, opinions (maker-checker), research; templates +
            clauses (versioned, immutable-after-publish, maker-checker); references/relationships/reviews. Ordering
            key = aggregate id (payload recordId); consumers dedupe on eventId. Payloads carry ids/states only."}
  # GAP CLOSED for m19-finance (Stage 3.1) — finance.lifecycle registered with the engine that emits it, declared
  # in packages/contracts/src/finance-events.ts. Delivered through the single transactional outbox (m06). 33 event
  # types, payload v1; carry ids/codes/states/dates/reference-dimensions ONLY — never monetary amounts, balances or
  # float (ADR-007). m19 is the finance FOUNDATION (accounting entities, chart of accounts, fiscal calendar/periods,
  # currencies + FX, cost centres/dimensions, tax codes/rates, payment terms, config); it holds no journals,
  # postings, reconciliation or approvals (those are m21/m15/m20/m22). Period open/close/lock is the cross-module
  # signal downstream posting (m21) consumes to honour "no posting into a closed period".
  - {group: finance_foundation, families: [finance.lifecycle], mvp: true, status: implemented, owner: m19-finance,
     classification: internal,
     note: "Stage 3.1. Accounting entity/chart-of-accounts/fiscal-period/currency/FX/cost-centre/dimension/tax/
            payment-term/config lifecycle. Ordering key = aggregate id (payload recordId); consumers dedupe on
            eventId. Payloads carry ids/codes/states/dates only — never amounts."}
  - {group: finance, families: [reconciliation.lifecycle, glrecon.lifecycle, journal.lifecycle, approval.lifecycle, posting_request.lifecycle], mvp: true, status: documented, note: posting deferred}
  - {group: ai, families: [ai.request_lifecycle, ai.output_lifecycle, ai.governance_lifecycle], mvp: partial, status: documented}
  - {group: platform, families: [platform.lifecycle, studio.lifecycle, analytics.lifecycle], mvp: false, status: documented}
  - {group: integration, families: [connector.lifecycle, marketplace.lifecycle, devportal.lifecycle, webhook.lifecycle, eventstream.lifecycle, govrelease.lifecycle], mvp: false, status: documented}
  - {group: automation, families: [automation.lifecycle, extension.lifecycle], mvp: false, status: documented}
  - {group: commercial_saas, families: [subscription.lifecycle, usage.lifecycle, billing.lifecycle], mvp: false, status: deferred}
  - {group: resilience, families: [mobile.lifecycle, backup.lifecycle, dr.lifecycle], mvp: false, status: documented}
  - {group: security, families: [security.identity_lifecycle, security.privileged_lifecycle, security.dlp_lifecycle, security.crypto_lifecycle, security.grc_lifecycle, security.privacy_lifecycle, security.soc_lifecycle], mvp: false, status: documented}
  - {group: certification, families: [certification.programme_lifecycle, certification.migration_lifecycle, certification.uat_lifecycle, certification.pilot_lifecycle, certification.release_lifecycle], mvp: false, status: documented}
