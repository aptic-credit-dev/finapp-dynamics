# schema: finapp-dynamics/permission-registry/v1
# Permission namespace registry. Format module.entity.action; seeded in the identity catalogue (m02); enforced
# server-side. Reference baseline: ~1234 permissions. status is for the target repo. Grants: tenant_admin -> full
# module grants (never business-approval overrides); auditor -> *.view. No permission overrides a hard rule.
registry_version: 1
reference_permission_count: 1234
format: module.entity.action
grant_rules:
  tenant_admin: full module grants except business approvals
  auditor: read (*.view) grants
  hard_rules_never_overridden: [no_self_approval, no_self_signoff_of_own_assessed_domain, immutable_decisions, no_ai_executed_controlled_actions, maker_not_checker]
namespaces:
  # Stage 1A registered the concrete codes under this namespace. NOTE the entity segment: the kernel's
  # @Endpoint validator requires <domain>.<entity>.<action>, so the tenant record's own permissions are
  # `tenant.registry.*` — `tenant.view` has two segments and is rejected at class-definition time.
  # Declared, not granted: no role holds these until m02-identity ships the RBAC model.
  - {namespace: "tenant.*", module: m01-tenant, mvp: true, status: implemented,
     codes: ["tenant.registry.view", "tenant.registry.create", "tenant.registry.edit",
             "tenant.registry.review", "tenant.registry.approve", "tenant.registry.provision",
             "tenant.registry.activate", "tenant.registry.restrict", "tenant.registry.suspend",
             "tenant.registry.reactivate", "tenant.registry.close",
             "tenant.environment.view", "tenant.environment.manage",
             "tenant.entity.view", "tenant.entity.manage",
             "tenant.department.view", "tenant.department.manage",
             "tenant.branch.view", "tenant.branch.manage"]}
  # Stage 1B registered the concrete identity.* codes. Three segments, per the kernel's @Endpoint
  # validator. Declared, NOT granted: no role holds them until Stage 1D ships the RBAC model.
  - {namespace: "identity.*", module: m02-identity, mvp: true, status: implemented, substage: 1B,
     codes: ["identity.registry.view", "identity.registry.create", "identity.registry.edit",
             "identity.registry.activate", "identity.registry.suspend", "identity.registry.reactivate",
             "identity.registry.close",
             "identity.account.view", "identity.account.create", "identity.account.activate",
             "identity.account.suspend", "identity.account.reactivate", "identity.account.deactivate",
             "identity.membership.view", "identity.membership.create", "identity.membership.activate",
             "identity.membership.suspend", "identity.membership.reactivate", "identity.membership.end",
             "identity.membership.scope"]}
  # Stage 1C (m02-auth). Administrative, cross-account SESSION management only — self-service on one's own
  # sessions needs no permission (the owner is the actor). Three segments, per the @Endpoint validator.
  # Declared, NOT granted: no role holds these until Stage 1D ships the RBAC model, exactly as identity.*.
  - {namespace: "auth.*", module: m02-auth, mvp: true, status: implemented, substage: 1C,
     codes: ["auth.session.view", "auth.session.revoke"]}
  # Stage 1D (m02-rbac). Persistent RBAC administration. Three segments per the @Endpoint validator.
  # Owner reconciled to m02-rbac (D3). Declared AND granted (via roles) from 1D — this is the module that
  # ends the "declared, not granted" era: roles hold concrete grants, no client injection, no wildcards.
  - {namespace: "rbac.*", module: m02-rbac, mvp: true, status: implemented, substage: 1D,
     codes: ["rbac.permission.view",
             "rbac.role.view", "rbac.role.create", "rbac.role.edit", "rbac.role.activate",
             "rbac.role.suspend", "rbac.role.retire",
             "rbac.assignment.view", "rbac.assignment.grant", "rbac.assignment.revoke",
             "rbac.sod.view", "rbac.sod.manage",
             "rbac.bootstrap.execute"]}
  # Stage 2.1 (m03-audit). Read/investigation over the audit spine. Three segments per the @Endpoint
  # validator. Platform view is a SEPARATE grant from tenant view — a tenant admin never sees platform events.
  - {namespace: "audit.*", module: m03-audit, mvp: true, status: implemented, substage: "2.1",
     codes: ["audit.event.view", "audit.event.search", "audit.event.export",
