# Aptic Dynamics staging web — serves the React SPA and proxies /api to the API on the SAME origin, so the
# session cookie + CSRF double-submit work without CORS. Bound to loopback on the host (access via SSH tunnel);
# PostgreSQL is never exposed here. Synthetic data only.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # security headers (staging)
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # API proxy (same origin -> cookies flow). The API enforces auth/RBAC/CSRF/RLS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
