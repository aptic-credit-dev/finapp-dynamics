# Stage-7 provider-neutral NON-PRODUCTION staging stack: PostgreSQL 16 + the Node API only.
# No cloud/provider, no Redis/object-store, no host network, no privileged containers.
name: finapp-stage7-staging

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # DB port is bound to loopback ONLY (not 0.0.0.0) — not unnecessarily public.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    # Auto-restart so containers survive a host reboot/crash (production-candidate host). Hardened 2026-08-22
    # (was 'no', which would not survive the reboot required after security updates).
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' } # bound container log growth

  api:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_OWNER_ROLE: ${DATABASE_OWNER_ROLE}
      DATABASE_APP_ROLE: ${DATABASE_APP_ROLE}
      # Optional DB pool size (concurrency knob only). Blank/unset -> node-postgres default (10). Keep <= PG max_connections.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      FINAPP_ALLOWED_ORIGINS: ${FINAPP_ALLOWED_ORIGINS}
      FINAPP_COOKIE_SECURE: ${FINAPP_COOKIE_SECURE}
      FINAPP_COOKIE_SAMESITE: ${FINAPP_COOKIE_SAMESITE}
      # OpenBao secrets provider (ADR-132). ALL blank/unset by default -> M41 keeps the fail-closed
      # UnavailableSecretProvider (no network opened). Set these (out-of-band) to bind the approved OpenBao
      # instance once the dedicated host exists. FINAPP_OPENBAO_SECRET_ID is a secret -> supply via env/secret
      # store, never commit. See deploy/openbao/ and STAGE_7_OPENBAO_LIVE_BINDING_EVIDENCE.md.
      FINAPP_OPENBAO_ADDR: ${FINAPP_OPENBAO_ADDR:-}
      FINAPP_OPENBAO_CA_CERT_PEM: ${FINAPP_OPENBAO_CA_CERT_PEM:-}
      FINAPP_OPENBAO_AUTH_METHOD: ${FINAPP_OPENBAO_AUTH_METHOD:-}
      FINAPP_OPENBAO_ROLE_ID: ${FINAPP_OPENBAO_ROLE_ID:-}
      FINAPP_OPENBAO_SECRET_ID: ${FINAPP_OPENBAO_SECRET_ID:-}
      FINAPP_OPENBAO_TRANSIT_MOUNT: ${FINAPP_OPENBAO_TRANSIT_MOUNT:-}
      FINAPP_OPENBAO_TRANSIT_KEY_PREFIX: ${FINAPP_OPENBAO_TRANSIT_KEY_PREFIX:-}
      FINAPP_OPENBAO_TIMEOUT_MS: ${FINAPP_OPENBAO_TIMEOUT_MS:-}
    # API bound to loopback only.
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/api/v1/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    # Auto-restart so containers survive a host reboot/crash (production-candidate host). Hardened 2026-08-22
    # (was 'no', which would not survive the reboot required after security updates).
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' } # bound container log growth
